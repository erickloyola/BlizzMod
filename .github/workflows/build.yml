name: Build BlizzMod

on:
  push:
    branches: [ master, main, testes, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild BlizzMod.sln /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64 -m

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "x64\Release\BlizzMod.dll") {
              Copy-Item "x64\Release\BlizzMod.dll" -Destination "artifacts\BlizzMod.dll"
              Copy-Item "x64\Release\BlizzMod.dll" -Destination "artifacts\version.dll"
          } else {
              Get-ChildItem -Path . -Recurse -Filter "*.dll" | Copy-Item -Destination "artifacts\"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlizzMod-Release-x64
          path: artifacts/
